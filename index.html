<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Викторина: От недр Земли до полимеров</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 16px;
    background: linear-gradient(135deg, #f0f2f5 0%, #d9e2ec 100%);
    color: #1a1a1a;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    overflow: hidden;
    padding-bottom: 24px;
  }
  header {
    background: linear-gradient(135deg, #d71920 0%, #a00d15 100%);
    color: #fff;
    padding: 28px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.3; }
  header p { margin: 0; font-size: 14px; opacity: .85; }

  /* Прогресс-бар */
  .progress-wrap { padding: 16px 20px 0; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 6px; text-align: right; }
  .progress-bar-bg { height: 6px; background: #e1e4e8; border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; width: 0%; background: #d71920; transition: width 0.3s ease; }

  .quiz-content { padding: 16px 20px; }

  .q {
    background: #fff;
    padding: 20px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .q:last-child { border-bottom: none; }
  .q p.title { margin: 0 0 16px; font-weight: 600; font-size: 16px; line-height: 1.4; }

  /* Стили для вариантов ответов — строго в столбик */
  .q label {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 2px solid #e0e4ea;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 15px;
    color: #333;
  }
  .q label:hover { border-color: #d71920; background-color: #fff8f8; }
  .q input[type="radio"] {
    margin-right: 12px;
    transform: scale(1.4);
    accent-color: #d71920;
    flex-shrink: 0;
  }
  
  /* Подсветка выбранного ответа */
  .q label:has(input[type="radio"]:checked) {
    border-color: #d71920;
    background-color: #fff0f0;
    box-shadow: 0 4px 12px rgba(215, 25, 32, 0.1);
  }

  /* Подсветка после проверки */
  .q label.correct { border-color: #2e9e4f; background-color: #e8f8ec; }
  .q label.wrong { border-color: #d71920; background-color: #fdecec; }
  .q input:disabled + span { opacity: 0.7; }

  button#submitBtn {
    display: block;
    width: calc(100% - 40px);
    margin: 20px auto 0;
    padding: 16px;
    font-size: 17px;
    font-weight: 600;
    background: #d71920;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  button#submitBtn:hover { background: #b01018; }
  button#submitBtn:disabled { background: #b9bec6; cursor: default; }

  #result {
    display: none;
    background: #fff;
    padding: 24px;
    border-radius: 16px;
    margin: 20px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  #result .score { font-size: 42px; font-weight: 800; color: #d71920; margin-bottom: 8px; }
  #result .text { font-size: 16px; color: #444; margin-bottom: 20px; line-height: 1.5; }
  #result button {
    background: #2c3e50; color: #fff; border: none;
    padding: 14px 24px; border-radius: 10px; font-size: 16px;
    cursor: pointer; width: 100%; font-weight: 600;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>«От недр Земли до полимеров»</h1>
    <p>К 35-летию ЛУКОЙЛ и 45-летию ООО «Ставролен»</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-text" id="progressText">Отвечено: 0 из 8</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="quiz-content" id="quiz"></div>

  <button id="submitBtn" onclick="check()">Проверить результат</button>

  <div id="result">
    <div class="score" id="scoreText"></div>
    <div class="text" id="scoreComment"></div>
    <button onclick="location.reload()">Пройти заново</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "1. Что такое нефть?",
    options: [
      "Минеральное масло",
      "Природная маслянистая горючая жидкость, состоящая из сложной смеси углеводородов и некоторых других органических соединений",
      "Синтетический продукт"
    ],
    correct: 1
  },
  {
    q: "2. Что такое баррель в контексте нефтяной отрасли?",
    options: [
      "Единица объёма нефти (обычно 159 л)",
      "Инструмент для бурения",
      "Вид нефтепродукта"
    ],
    correct: 0
  },
  {
    q: "3. Какая последовательность этапов наиболее точно отражает путь нефти и газа от месторождения до конечного потребителя?",
    options: [
      "Георазведка → Добыча нефти → Переработка нефти и газа → Производство электроэнергии",
      "Добыча нефти → Георазведка → Переработка нефти и газа → Производство электроэнергии",
      "Георазведка → Переработка нефти и газа → Добыча нефти → Производство электроэнергии",
      "Добыча нефти → Георазведка → Переработка нефти и газа → Производство электроэнергии"
    ],
    correct: 0
  },
  {
    q: "4. Дата образования нефтяного концерна «Лукойл».",
    options: ["25.12.1994 г.", "21.01.1981 г.", "25.11.1991 г."],
    correct: 2
  },
  {
    q: "5. Что изготавливают из продуктов переработки нефти и газа?",
    options: [
      "Дизельное топливо, керосин, битум, сырьё для пластмасс",
      "Пластмассу, технические масла и другие продукты",
      "Лекарства, духи, ароматизаторы, продукты питания",
      "Топливо, пластмассу, лекарства, духи, продукты питания и другие товары"
    ],
    correct: 3
  },
  {
    q: "6. Что из перечисленного не является продуктом нефтепереработки?",
    options: ["Бензин", "Дизельное топливо", "Природный газ", "Керосин"],
    correct: 2
  },
  {
    q: "7. Что сыграло решающую роль в выборе г. Прикумска для строительства Прикумского завода пластических масс?",
    options: [
      "Наличие в окрестностях Буденновска крупных месторождений нефти",
      "Близость к источникам дешёвой электроэнергии",
      "Через город проходила железная дорога",
      "Потребность в создании новых рабочих мест и развитии социальной инфраструктуры города"
    ],
    correct: 2
  },
  {
    q: "8. Какие крупные социальные проекты реализованы в г. Буденновске совместно с ПАО «Лукойл» и ООО «Ставролен»?",
    options: [
      "Спортивная арена «Лужники»",
      "Детский игровой комплекс «Олимпийский»",
      "Спортивно-тренировочный комплекс «Лукоморье»",
      "Автобусная остановка «Новый город»"
    ],
    correct: 2
  }
];

const quizContainer = document.getElementById('quiz');
questions.forEach((item, i) => {
  let html = `<div class="q" id="q${i}"><p class="title">${item.q}</p>`;
  item.options.forEach((opt, j) => {
    html += `<label id="lbl-${i}-${j}" onclick="updateProgress()">
      <input type="radio" name="q${i}" value="${j}"> <span>${opt}</span>
    </label>`;
  });
  quizContainer.innerHTML += html + '</div>';
});

// Логика прогресс-бара
function updateProgress() {
  const total = questions.length;
  let answered = 0;
  questions.forEach((_, i) => {
    if (document.querySelector(`input[name="q${i}"]:checked`)) answered++;
  });
  document.getElementById('progressText').textContent = `Отвечено: ${answered} из ${total}`;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

function check() {
  let score = 0;
  let allAnswered = true;

  questions.forEach((_, i) => {
    if (!document.querySelector(`input[name="q${i}"]:checked`)) allAnswered = false;
  });

  if (!allAnswered) {
    alert("Пожалуйста, ответьте на все вопросы!");
    return;
  }

  questions.forEach((item, i) => {
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const chosen = +sel.value;
    if (chosen === item.correct) score++;

    document.getElementById(`lbl-${i}-${item.correct}`).classList.add('correct');
    if (chosen !== item.correct) {
      document.getElementById(`lbl-${i}-${chosen}`).classList.add('wrong');
    }
    document.querySelectorAll(`input[name="q${i}"]`).forEach(inp => inp.disabled = true);
  });

  const total = questions.length;
  const percent = Math.round(score / total * 100);
  let comment = "";
  if (percent === 100) comment = "Отличный результат! Вы настоящий знаток нефтяной отрасли! 🏆";
  else if (percent >= 75) comment = "Хороший результат! Немного повторите материал и будет отлично. 👍";
  else if (percent >= 50) comment = "Неплохо, но есть что подтянуть. Загляните в экспозицию ещё раз. 📖";
  else comment = "Стоит внимательнее изучить выставку — и всё получится! 💪";

  document.getElementById('scoreText').textContent = `${score} из ${total} (${percent}%)`;
  document.getElementById('scoreComment').textContent = comment;
  
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
